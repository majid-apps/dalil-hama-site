<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الصفحة غير موجودة — دليل حماة</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a3a35">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/app.css?v=8">
<style>
  body { padding-bottom: 0; }
  .nf { max-width: 520px; margin-inline: auto; padding: calc(110px + env(safe-area-inset-top)) 0 48px; text-align: center; }
  .nf .big { font-size: 64px; line-height: 1; }
  .nf h1 { margin: 12px 0 6px; font-family: var(--font-display); font-size: 28px; }
  .nf p { margin: 0 0 22px; color: var(--ink-2); }
  .nf form { display: flex; gap: 8px; margin-bottom: 18px; }
  .nf .input { flex: 1; }
</style>
<script src="/assets/js/theme.js?v=3"></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="دليل حماة — الرئيسية">
      <span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/img/icons.svg#noria"/></svg></span>
      <span>دليل حماة<small>حماة بين يديك</small></span>
    </a>
  </div>
</header>
<main class="wrap nf">
  <div class="big" aria-hidden="true">🧭</div>
  <h1>لم نجد هذه الصفحة</h1>
  <p>الرابط الذي فتحته غير صحيح أو لم يعد موجوداً. ابحث عمّا تريده مباشرة:</p>
  <form action="/" method="get" role="search">
    <label class="sr" for="q">ابحث في دليل حماة</label>
    <input class="input" id="q" name="q" type="search" placeholder="ابحث باسم، مهنة، حي أو رقم…" maxlength="60" autocomplete="off">
    <button class="btn btn-primary" type="submit">بحث</button>
  </form>
  <a class="btn btn-soft" href="/">العودة إلى الدليل</a>
</main>
</body>
</html>
