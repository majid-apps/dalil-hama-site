<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موافقة صاحب الرقم — دليل حماة</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a3a35">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/app.css?v=7">
<style>
  body { padding-bottom: 0; }
  .owner { max-width: 560px; margin-inline: auto; padding: calc(96px + env(safe-area-inset-top)) 0 32px; }
  .o-box { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px 18px; }
  .o-box h1 { margin: 0 0 14px; font-size: 21px; line-height: 1.5; }
  .o-box .o-biz { font-family: var(--font-display); font-size: 24px; line-height: 1.4; margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .o-box .o-cat { color: var(--muted); font-size: 14.5px; margin: 4px 0 10px; }
  .o-num { display: inline-block; direction: ltr; unicode-bidi: isolate; font-size: 22px; font-weight: 700; letter-spacing: .5px; margin: 0 0 14px; }
  .o-box p { color: var(--ink-2); margin: 0 0 16px; line-height: 1.8; }
  .o-acts { display: grid; gap: 10px; }
  .o-acts .btn { justify-content: center; }
  .o-danger { background: var(--danger); color: #fff; }
  .o-box .o-note { font-size: 13.5px; color: var(--muted); margin: 14px 0 0; }
  .o-state { text-align: center; padding: 6px 0 2px; }
  .o-big { font-size: 46px; line-height: 1; margin-bottom: 10px; }
  .o-state h2 { margin: 0 0 8px; font-size: 20px; }
  .o-confirm { border: 1px solid var(--danger); background: var(--danger-soft); border-radius: 14px; padding: 14px; }
  .o-confirm p { color: var(--ink); margin-bottom: 12px; }
  .o-foot { text-align: center; margin-top: 16px; font-size: 14px; }
  .o-addr { color: var(--muted); font-size: 14.5px; margin: 0 0 12px !important; }
  .o-form { display: grid; gap: 12px; }
  .o-form label { display: grid; gap: 6px; font-weight: 700; font-size: 14.5px; }
  .o-form em { font-weight: 400; color: var(--muted); font-style: normal; }
  .o-form .input { width: 100%; font-weight: 400; }
  .topbar .spacer { flex: 1; }
</style>
<script src="/assets/js/theme.js?v=3"></script>
<script type="module" src="/assets/js/owner.js?v=3"></script>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/" aria-label="دليل حماة — الرئيسية">
      <span class="mark"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="/assets/img/icons.svg#noria"/></svg></span>
      <span>دليل حماة<small>حماة بين يديك</small></span>
    </a>
    <span class="spacer"></span>
  </div>
</header>

<main class="wrap" id="main">
  <article class="owner">
    <div class="o-box" id="box" aria-live="polite"><p>جارٍ التحميل…</p></div>
    <p class="o-foot"><a href="/privacy/">سياسة الخصوصية</a> · <a href="/">دليل حماة</a></p>
  </article>
</main>
<noscript><p style="text-align:center">هذه الصفحة تحتاج تفعيل جافاسكربت في المتصفح.</p></noscript>
</body>
</html>
